---
- name: "[proxmox]: apply guest local DATA-Link NIC plan"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed | default('/usr/bin/python3') }}"
    proxmox_feature_group_vars_path: "{{ playbook_dir }}/../group_vars/proxmox.yml"
    proxmox_network_facts_dir_default: "/etc/ansible/proxmox/facts"

  pre_tasks:
    - name: Load manual Proxmox feature defaults when available
      include_vars:
        file: "{{ proxmox_feature_group_vars_path }}"
      ignore_errors: true

    - name: Resolve effective network update facts directory
      set_fact:
        proxmox_network_facts_dir_effective: >-
          {{
            proxmox_network_facts_dir
            | default(
                (proxmox_network | default({})).get('facts_dir', proxmox_network_facts_dir_default),
                true
              )
          }}

    - name: Resolve effective network update artifact paths
      set_fact:
        proxmox_network_intent_path_effective: >-
          {{
            proxmox_network_intent_path
            | default(
                (proxmox_network | default({})).get(
                  'intent_path',
                  proxmox_network_facts_dir_effective + '/network.intent.yml'
                ),
                true
              )
          }}
        proxmox_network_plan_path_effective: >-
          {{
            proxmox_network_plan_path
            | default(
                (proxmox_network | default({})).get(
                  'plan_path',
                  proxmox_network_facts_dir_effective + '/network.plan.tsv'
                ),
                true
              )
          }}
        proxmox_network_update_runtime_facts_path_effective: >-
          {{
            proxmox_network_update_runtime_facts_path
            | default(
                (proxmox_network | default({})).get(
                  'update_runtime_facts_path',
                  proxmox_network_facts_dir_effective + '/network.update.runtime.yml'
                ),
                true
              )
          }}

    - name: Stat update intent file
      stat:
        path: "{{ proxmox_network_intent_path_effective }}"
      register: proxmox_network_intent_stat

    - name: Load update intent file when present
      include_vars:
        file: "{{ proxmox_network_intent_path_effective }}"
      when: proxmox_network_intent_stat.stat.exists

    - name: Resolve effective update mode
      set_fact:
        proxmox_network_update_mode_effective: >-
          {{
            proxmox_network_update_mode | default('')
            if (proxmox_network_update_mode | default('') | length > 0)
            else
            (
              proxmox_network_update.mode
              if (proxmox_network_update is defined and proxmox_network_update.mode is defined)
              else 'check'
            )
          }}

    - name: Assert effective update mode is valid
      assert:
        that:
          - proxmox_network_update_mode_effective in ['check', 'apply']
        fail_msg: "Unsupported proxmox_network_update_mode_effective={{ proxmox_network_update_mode_effective }}"

    - name: Validate expected DATA-Link host address
      command:
        argv:
          - python3
          - -c
          - |-
            import ipaddress
            import sys
            try:
                interface = ipaddress.ip_interface(sys.argv[1])
                network = interface.network
                valid = (
                    isinstance(interface, ipaddress.IPv4Interface)
                    and 1 <= network.prefixlen <= 30
                    and interface.ip not in (network.network_address, network.broadcast_address)
                )
            except ValueError:
                valid = False
            if not valid:
                raise SystemExit(1)
            print(f"{interface.ip}/{network.prefixlen}")
          - "{{ proxmox_network_expected_data_ipv4_cidr | default('') }}"
      register: proxmox_network_expected_data_ipv4_validation
      changed_when: false
      failed_when: false

    - name: Require canonical assignable DATA-Link host address
      assert:
        that:
          - proxmox_network_expected_data_ipv4_validation.rc == 0
          - proxmox_network_expected_data_ipv4_validation.stdout == (proxmox_network_expected_data_ipv4_cidr | default(''))
        fail_msg: >-
          Expected DATA-Link address must be a canonical assignable IPv4 host CIDR,
          not a network or broadcast address:
          {{ proxmox_network_expected_data_ipv4_cidr | default('missing') }}

    - name: Stat update plan TSV
      stat:
        path: "{{ proxmox_network_plan_path_effective }}"
      register: proxmox_network_plan_stat

    - name: Assert update plan TSV exists
      assert:
        that:
          - proxmox_network_plan_stat.stat.exists
          - not proxmox_network_plan_stat.stat.isdir
        fail_msg: "Missing update plan TSV: {{ proxmox_network_plan_path_effective }}"

  tasks:
    - name: Execute guest network update plan
      shell: |
        set -euo pipefail
        mode="{{ proxmox_network_update_mode_effective }}"
        plan="{{ proxmox_network_plan_path_effective }}"
        tab="$(printf '\t')"
        changed=0
        would_change=0
        errors=0
        expected_egress_if="{{ proxmox_network_expected_guest_egress_if | default('') }}"
        expected_data_if="{{ proxmox_network_expected_guest_data_if | default('') }}"
        expected_data_cidr="{{ proxmox_network_expected_data_ipv4_cidr | default('') }}"

        while IFS="${tab}" read -r guest_type guest_id guest_name net_slot desired_value reason; do
          [ "${guest_type}" = "guest_type" ] && continue
          if [ -z "${guest_type}" ] || [ -z "${guest_id}" ] || [ -z "${net_slot}" ] || [ -z "${desired_value}" ]; then
            echo "ERROR\tinvalid_row\t${guest_type}\t${guest_id}\t${guest_name}\t${net_slot}\t${reason}"
            errors=$((errors + 1))
            continue
          fi

          if [ "${guest_type}" = "lxc" ]; then
            live_config="$(pct config "${guest_id}" 2>/dev/null || true)"
            current_value="$(printf '%s\n' "${live_config}" | sed -n "s/^${net_slot}: //p" | head -n1 || true)"
            case ",${desired_value}," in
              *,gw=*|*,gw6=*|*,ip=dhcp,*|*,ip6=dhcp,*)
                echo "ERROR\tunsafe_data_route\tlxc\t${guest_id}\t${guest_name}\t${net_slot}\t${desired_value}"
                errors=$((errors + 1))
                continue
                ;;
            esac
            case ",${desired_value}," in
              *,firewall=1,*) ;;
              *) echo "ERROR\tdata_nic_firewall_disabled\tlxc\t${guest_id}\t${desired_value}"; errors=$((errors + 1)); continue ;;
            esac
            if [ -z "${expected_egress_if}" ] \
              || ! printf '%s\n' "${live_config}" | grep -Eq "^net[0-9]+: .*name=${expected_egress_if}(,|$)"; then
              echo "ERROR\tmissing_preserved_egress_role\tlxc\t${guest_id}\t${expected_egress_if}"
              errors=$((errors + 1))
              continue
            fi
            if [ -n "${expected_data_if}" ] && [ -n "${expected_data_cidr}" ]; then
              case ",${desired_value}," in
                *,name=${expected_data_if},*|*,name=${expected_data_if}) ;;
                *) echo "ERROR\tdata_interface_mismatch\tlxc\t${guest_id}\t${desired_value}"; errors=$((errors + 1)); continue ;;
              esac
              case ",${desired_value}," in
                *,ip=${expected_data_cidr},*|*,ip=${expected_data_cidr}) ;;
                *) echo "ERROR\tdata_cidr_mismatch\tlxc\t${guest_id}\t${desired_value}"; errors=$((errors + 1)); continue ;;
              esac
            fi
            if [ "${current_value}" = "${desired_value}" ]; then
              echo "NOOP\tlxc\t${guest_id}\t${guest_name}\t${net_slot}\t${desired_value}"
              continue
            fi
            if [ -n "${current_value}" ]; then
              echo "ERROR\trefuse_live_slot_overwrite\tlxc\t${guest_id}\t${guest_name}\t${net_slot}\t${current_value}"
              errors=$((errors + 1))
              continue
            fi

            if [ "${mode}" = "apply" ]; then
              pct set "${guest_id}" "-${net_slot}" "${desired_value}"
              echo "APPLY\tlxc\t${guest_id}\t${guest_name}\t${net_slot}\t${desired_value}"
              changed=1
            else
              echo "CHECK\tpct set ${guest_id} -${net_slot} ${desired_value}"
              would_change=1
            fi
            continue
          fi

          if [ "${guest_type}" = "vm" ]; then
            current_value="$(qm config "${guest_id}" 2>/dev/null | sed -n "s/^${net_slot}: //p" | head -n1 || true)"
            if [ "${current_value}" = "${desired_value}" ]; then
              echo "NOOP\tvm\t${guest_id}\t${guest_name}\t${net_slot}\t${desired_value}"
              continue
            fi

            if [ "${mode}" = "apply" ]; then
              qm set "${guest_id}" "-${net_slot}" "${desired_value}"
              echo "APPLY\tvm\t${guest_id}\t${guest_name}\t${net_slot}\t${desired_value}"
              changed=1
            else
              echo "CHECK\tqm set ${guest_id} -${net_slot} ${desired_value}"
              would_change=1
            fi
            continue
          fi

          echo "ERROR\tunsupported_guest_type\t${guest_type}\t${guest_id}\t${guest_name}\t${net_slot}\t${reason}"
          errors=$((errors + 1))
        done < "${plan}"

        echo "__WOULD_CHANGE__=${would_change}"
        echo "__CHANGED__=${changed}"
        echo "__ERRORS__=${errors}"
        [ "${errors}" -eq 0 ]
      args:
        executable: /bin/bash
      register: proxmox_network_update_exec
      changed_when: "'__CHANGED__=1' in proxmox_network_update_exec.stdout"

    - name: Persist network update runtime facts
      copy:
        dest: "{{ proxmox_network_update_runtime_facts_path_effective }}"
        mode: "0644"
        content: |
          ---
          proxmox_network_update_runtime:
            mode: "{{ proxmox_network_update_mode_effective }}"
            would_change: {{ ('__WOULD_CHANGE__=1' in proxmox_network_update_exec.stdout) | ternary('true', 'false') }}
            changed: {{ ('__CHANGED__=1' in proxmox_network_update_exec.stdout) | ternary('true', 'false') }}
            errors: "{{ proxmox_network_update_exec.stdout | regex_search('__ERRORS__=[0-9]+') | default('__ERRORS__=0') }}"
            stdout_lines:
          {% for line in proxmox_network_update_exec.stdout_lines | default([]) %}
              - {{ line | to_json }}
          {% endfor %}
            stderr_lines:
          {% for line in proxmox_network_update_exec.stderr_lines | default([]) %}
              - {{ line | to_json }}
          {% endfor %}

    - name: Show network update command summary
      debug:
        var: proxmox_network_update_exec.stdout_lines
