---
- name: "[debian]: lan defaults"
  hosts: all
  become: true
  gather_facts: false

  vars:
    lan_defaults:
      allow_subnets: "{{ network_defaults.allow_subnets | default([]) }}"
      manage_firewall: "{{ network_defaults.manage_firewall | default(false) | bool }}"
      ipv6: "{{ network_defaults.ipv6 | default(true) | bool }}"
      allow_rdp: "{{ network_defaults.allow_rdp | default(false) | bool }}"
      ssh_port: 22
      rdp_port: 3389

  tasks:
    - name: Capture allowed users from shared user_defs
      set_fact:
        lan_users: "{{ (user_defs | default([])) | map(attribute='name') | list }}"

    - name: Build allowed_users with root fallback
      set_fact:
        lan_allowed_users: "{{ (lan_users | default([])) | union(['root']) }}"

    - name: Show derived LAN allowed users
      debug:
        msg: "LAN defaults derived from shared vars: {{ lan_allowed_users | join(' ') }}"

    - name: Set LAN defaults for this play only
      set_fact:
        network_defaults: "{{ lan_defaults | combine({'allowed_users': lan_allowed_users}) }}"
