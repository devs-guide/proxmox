---
- name: "[debian]: baseline users"
  hosts: all
  become: true
  gather_facts: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed | default('/usr/bin/python3') }}"
    default_password_hash_algo: sha512
    proxmox_users_skip_container_safety_checks_effective: "{{ proxmox_users_skip_container_safety_checks | default(false) | bool }}"

  tasks:
    - name: Ensure sudo group exists
      ansible.builtin.group:
        name: "{{ bootstrap_default_sudo_group | default('sudo') }}"
        state: present

    - name: Ensure users exist with expected shell, password, and groups
      ansible.builtin.user:
        name: "{{ item.name }}"
        password: >-
          {{
            item.password_hash
            if (item.password_hash | default('') | length > 0)
            else (
              item.password | default(item.name, true)
            )
            | password_hash(default_password_hash_algo)
          }}
        password_lock: "{{ item.password_lock | default(false) }}"
        groups: >-
          {{
            (
              item.groups
              if (item.groups is defined)
              else (
                [bootstrap_default_sudo_group | default('sudo')]
                if (
                  item.name != 'root'
                  and (bootstrap_default_nonroot_sudo | default(true) | bool)
                )
                else []
              )
            ) | join(',')
          }}
        append: >-
          {{
            (
              item.groups is defined
              and (item.groups | length > 0)
            )
            or (
              item.name != 'root'
              and (bootstrap_default_nonroot_sudo | default(true) | bool)
            )
          }}
        shell: "{{ item.shell | default('/bin/bash') }}"
        create_home: true
        state: present
        update_password: "{{ item.update_password | default(bootstrap_default_user_update_password | default('always')) }}"
      loop: "{{ user_defs }}"

    - name: Ensure sudo policy file for managed bootstrap users is valid
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-debian-bootstrap-managed-users
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
        content: |
          # Ansible managed: Debian bootstrap sudo policy.
          %{{ bootstrap_default_sudo_group | default('sudo') }} ALL=(ALL:ALL) ALL
          {% if bootstrap_passwordless_sudo | default(false) | bool %}
          %{{ bootstrap_default_sudo_group | default('sudo') }} ALL=(ALL) NOPASSWD:ALL
          {% endif %}

    - name: Clear password expiry and inactivity requirements
      ansible.builtin.command: >
        chage -I -1 -m 0 -M 99999 -E -1 -d {{ ansible_facts["date_time"]["date"] }} {{ item.name }}
      loop: "{{ user_defs }}"
      changed_when: true

    - name: Verify managed non-root users have sudo membership
      ansible.builtin.command: "id -nG {{ item.name }}"
      register: managed_user_groups
      changed_when: false
      loop: "{{ user_defs | rejectattr('name', 'equalto', 'root') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - bootstrap_managed_users_require_sudo | default(true) | bool

    - name: Assert managed non-root users can use sudo group
      ansible.builtin.assert:
        that:
          - item.rc | default(1) == 0
          - "(bootstrap_default_sudo_group | default('sudo')) in ((item.stdout | default('')).split())"
        fail_msg: "Managed user {{ item.item.name | default('unknown') }} is missing sudo group membership."
      loop: >-
        {{
          managed_user_groups.results | default([])
          | rejectattr('skipped', 'defined')
          | list
        }}
      loop_control:
        label: "{{ item.item.name | default('unknown') }}"
      when:
        - bootstrap_managed_users_require_sudo | default(true) | bool
        - item.stdout is defined

    - name: Capture root filesystem mount options for sudo validation
      ansible.builtin.command:
        argv:
          - findmnt
          - -no
          - OPTIONS
          - /
      register: managed_root_mount_options
      changed_when: false
      when: not proxmox_users_skip_container_safety_checks_effective

    - name: Assert root filesystem is not mounted nosuid
      ansible.builtin.assert:
        that:
          - "'nosuid' not in ((managed_root_mount_options.stdout | default('')).split(','))"
        fail_msg: "Root filesystem is mounted nosuid; sudo cannot work correctly inside this container."
      when: not proxmox_users_skip_container_safety_checks_effective

    - name: Capture sudo config ownership and mode
      ansible.builtin.stat:
        path: /etc/sudo.conf
      register: managed_sudo_conf_stat
      when: not proxmox_users_skip_container_safety_checks_effective

    - name: Assert sudo config ownership is root-managed
      ansible.builtin.assert:
        that:
          - managed_sudo_conf_stat.stat.exists
          - managed_sudo_conf_stat.stat.uid == 0
          - managed_sudo_conf_stat.stat.gid == 0
        fail_msg: >-
          /etc/sudo.conf must be owned by root:root.
          Observed uid={{ managed_sudo_conf_stat.stat.uid | default('missing') }}
          gid={{ managed_sudo_conf_stat.stat.gid | default('missing') }}.
      when: not proxmox_users_skip_container_safety_checks_effective

    - name: Capture sudo binary ownership and mode
      ansible.builtin.stat:
        path: /usr/bin/sudo
      register: managed_sudo_bin_stat
      when: not proxmox_users_skip_container_safety_checks_effective

    - name: Assert sudo binary ownership is root-managed
      ansible.builtin.assert:
        that:
          - managed_sudo_bin_stat.stat.exists
          - managed_sudo_bin_stat.stat.uid == 0
          - managed_sudo_bin_stat.stat.gid == 0
        fail_msg: >-
          /usr/bin/sudo must be owned by root:root.
          Observed uid={{ managed_sudo_bin_stat.stat.uid | default('missing') }}
          gid={{ managed_sudo_bin_stat.stat.gid | default('missing') }}.
      when: not proxmox_users_skip_container_safety_checks_effective

    - name: Assert sudo binary retains the setuid bit
      ansible.builtin.command:
        argv:
          - test
          - -u
          - /usr/bin/sudo
      changed_when: false
      when: not proxmox_users_skip_container_safety_checks_effective

    - name: Validate sudo binary health from root context
      ansible.builtin.command:
        argv:
          - sudo
          - -V
      register: managed_sudo_health
      changed_when: false
      failed_when: false
      when: not proxmox_users_skip_container_safety_checks_effective

    - name: Assert sudo binary executes correctly
      ansible.builtin.assert:
        that:
          - managed_sudo_health.rc == 0
        fail_msg: >-
          sudo failed to execute correctly as root.
          This usually indicates broken container ownership mapping,
          a missing setuid bit, or an invalid mount policy. stderr={{ managed_sudo_health.stderr | default('') }}
      when: not proxmox_users_skip_container_safety_checks_effective

    - name: Verify managed non-root users can start a login shell
      ansible.builtin.command:
        argv:
          - su
          - -l
          - "{{ item.name }}"
          - -c
          - id
      register: managed_user_su_checks
      changed_when: false
      failed_when: false
      loop: "{{ user_defs | rejectattr('name', 'equalto', 'root') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert managed non-root users can switch identity cleanly
      ansible.builtin.assert:
        that:
          - item.rc | default(1) == 0
        fail_msg: >-
          Managed user {{ item.item.name | default('unknown') }} cannot be entered with su -l.
          This usually indicates broken gid mapping or missing setgroups capability inside the container.
          stderr={{ item.stderr | default('') }}
      loop: "{{ managed_user_su_checks.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default('unknown') }}"

    - name: Verify managed non-root users have a working sudo policy entry
      ansible.builtin.command:
        argv:
          - sudo
          - -l
          - -U
          - "{{ item.name }}"
      register: managed_user_sudo_policy_checks
      changed_when: false
      failed_when: false
      loop: "{{ user_defs | rejectattr('name', 'equalto', 'root') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - bootstrap_managed_users_require_sudo | default(true) | bool

    - name: Assert managed non-root users have a working sudo policy entry
      ansible.builtin.assert:
        that:
          - item.rc | default(1) == 0
        fail_msg: >-
          Managed user {{ item.item.name | default('unknown') }} does not have a working sudo policy entry.
          stderr={{ item.stderr | default('') }}
      loop: >-
        {{
          managed_user_sudo_policy_checks.results | default([])
          | rejectattr('skipped', 'defined')
          | list
        }}
      loop_control:
        label: "{{ item.item.name | default('unknown') }}"
      when:
        - bootstrap_managed_users_require_sudo | default(true) | bool
