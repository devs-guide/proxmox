---
- name: "[debian]: baseline users (customize for production)"
  hosts: all
  become: true
  gather_facts: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed }}"
    default_password_hash_algo: sha512

  tasks:
    - name: Ensure users exist with initial passwords
      user:
        name: "{{ item.name }}"
        password: "{{ (item.password | default(item.name, true)) | password_hash(default_password_hash_algo) }}"
        shell: /bin/bash
        state: present
        update_password: always
      loop: "{{ user_defs }}"

    - name: Clear password expiry and inactivity requirements
      command: >
        chage -I -1 -m 0 -M 99999 -E -1 -d {{ ansible_facts["date_time"]["date"] }} {{ item.name }}
      loop: "{{ user_defs }}"
