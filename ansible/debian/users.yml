---
- name: "[debian]: baseline users (customize for production)"
  hosts: all
  become: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_system }}"
    user_defs:
      # password defaults to the username if not provided; override for real deployments
      - name: agent
      - name: proxmox
      - name: root
    default_password_hash_algo: sha512

  pre_tasks:
    - name: Ensure python3-passlib is present for password hashing
      apt:
        name: python3-passlib
        state: present
        update_cache: true

  tasks:
    - name: Ensure users exist with initial passwords
      user:
        name: "{{ item.name }}"
        password: "{{ (item.password | default(item.name, true)) | password_hash(default_password_hash_algo) }}"
        shell: /bin/bash
        state: present
      loop: "{{ user_defs }}"

    - name: Clear password expiry and inactivity requirements
      command: >
        chage -I -1 -m 0 -M 99999 -E -1 -d {{ ansible_date_time.date }} {{ item.name }}
      loop: "{{ user_defs }}"
