---
- name: "[debian]: baseline SSH and firewall networking"
  hosts: all
  become: true
  vars:
    # Allow per-play overrides; fallback to group_vars defaults
    network_overrides: {}
    network_config: "{{ (network_defaults | default({})) | combine(network_overrides | default({}), recursive=True) }}"

  pre_tasks:
    - name: Assert Debian family
      assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: "This playbook is intended for Debian-family hosts."

    - name: Build safe networking values (users, subnets)
      set_fact:
        network_allowed_users: "{{ (network_config.allowed_users | default([])) | union(['root']) }}"
        network_allow_subnets: "{{ network_config.allow_subnets | default([]) }}"

    - name: Ensure networking values are usable
      set_fact:
        network_allow_subnets: "{{ ['10.0.0.0/24'] if (network_allow_subnets | length == 0) else network_allow_subnets }}"

    - name: Validate required networking defaults are present
      assert:
        that:
          - network_config.ssh_port is defined
          - network_allowed_users | length > 0
          - network_allow_subnets | length > 0
          - (not (network_config.allow_rdp | default(false) | bool)) or (network_config.rdp_port is defined)
        fail_msg: "network_config is missing required keys (ssh_port, allowed_users, allow_subnets)"

  tasks:
    - name: Disable IPv6 in UFW
      lineinfile:
        path: /etc/default/ufw
        regexp: '^IPV6='
        line: 'IPV6=no'
      notify: Reload ufw

    - name: Configure SSH port
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^Port '
        line: "Port {{ network_config.ssh_port }}"
        state: present
        create: false
        backrefs: false

    - name: Configure SSH AllowUsers
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^AllowUsers '
        line: "AllowUsers {{ network_allowed_users | join(' ') }}"
        state: present
        create: false
        backrefs: false

    - name: Reload sshd if config changed
      service:
        name: sshd
        state: reloaded
      when: ansible_facts.services is not defined or 'sshd' in ansible_facts.services

    - name: Ensure UFW is installed
      apt:
        name: ufw
        state: present
        update_cache: true

    - name: Allow SSH from permitted subnets
      ufw:
        rule: allow
        port: "{{ network_config.ssh_port }}"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ network_allow_subnets }}"

    - name: Allow Proxmox web UI from permitted subnets
      ufw:
        rule: allow
        port: "8006"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ network_allow_subnets }}"

    - name: Allow RDP from permitted subnets (if enabled)
      ufw:
        rule: allow
        port: "{{ network_config.rdp_port }}"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ network_allow_subnets }}"
      when: network_config.allow_rdp | bool

    - name: Ensure UFW is enabled with logging (low)
      ufw:
        state: enabled
        logging: low
      notify: Reload ufw

  handlers:
    - name: Reload ufw
      ufw:
        state: reloaded
