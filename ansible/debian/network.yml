---
- name: "[debian]: baseline SSH and firewall networking"
  hosts: all
  become: true
  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed }}"
    # Allow per-play overrides; fallback to group_vars defaults
    network_overrides: {}
    network_config: "{{ (network_defaults | default({})) | combine(network_overrides | default({}), recursive=True) }}"

  pre_tasks:
    - name: Assert Debian family
      assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: "This playbook is intended for Debian-family hosts."

    - name: Capture shared user names
      set_fact:
        shared_user_names: "{{ (user_defs | default([])) | map(attribute='name') | list }}"

    - name: Resolve SSH policy inputs
      set_fact:
        resolved_ssh_allowed_users: >-
          {{
            ssh_allowed_users
            if (ssh_allowed_users | default([]) | length > 0)
            else (
              network_config.allowed_users
              if (network_config.allowed_users | default([]) | length > 0)
              else shared_user_names
            )
          }}

    - name: Build safe networking values (users, subnets)
      set_fact:
        network_allowed_users: "{{ (resolved_ssh_allowed_users | default([])) | union(['root']) }}"
        network_allow_subnets: "{{ network_config.allow_subnets | default([]) }}"

    - name: Ensure networking values are usable
      set_fact:
        network_allow_subnets: "{{ ['10.0.0.0/24'] if (network_allow_subnets | length == 0) else network_allow_subnets }}"

    - name: Show resolved shared user_defs
      debug:
        msg: "Shared user_defs resolved to: {{ shared_user_names | join(' ') }}"

    - name: Show resolved ssh_allowed_users input
      debug:
        msg: "SSH policy source users resolved to: {{ resolved_ssh_allowed_users | default([]) | join(' ') }}"

    - name: Show final SSH-allowed users
      debug:
        msg: "SSH AllowUsers will be set to: {{ network_allowed_users | join(' ') }}"

    - name: Validate required networking defaults are present
      assert:
        that:
          - network_config.ssh_port is defined
          - network_allowed_users | length > 0
          - "'agent' in network_allowed_users"
          - "'proxmox' in network_allowed_users"
          - "'root' in network_allowed_users"
          - network_allow_subnets | length > 0
          - (not (network_config.allow_rdp | default(false) | bool)) or (network_config.rdp_port is defined)
        fail_msg: "network_config is missing required SSH policy values (ssh_port, allowed_users, allow_subnets)"

  tasks:
    - name: Ensure UFW is installed
      command:
        argv:
          - apt-get
          - update
      changed_when: false

    - name: Install UFW package
      command:
        argv:
          - apt-get
          - "-y"
          - install
          - ufw

    - name: Check UFW defaults file
      stat:
        path: /etc/default/ufw
      register: ufw_default

    - name: Disable IPv6 in UFW
      lineinfile:
        path: /etc/default/ufw
        regexp: '^IPV6='
        line: 'IPV6=no'
      notify: Reload ufw
      when: ufw_default.stat.exists

    - name: Configure SSH port
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^Port '
        line: "Port {{ network_config.ssh_port }}"
        state: present
        create: false
        backrefs: false

    - name: Configure SSH AllowUsers
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^AllowUsers '
        line: "AllowUsers {{ network_allowed_users | join(' ') }}"
        state: present
        create: false
        backrefs: false

    - name: Determine SSH service name (ssh on modern Debian, sshd fallback)
      set_fact:
        ssh_service_name: >-
          {{ 'ssh'
             if (ansible_facts.services is defined and 'ssh' in ansible_facts.services)
             else 'sshd' }}

    - name: Reload SSH service if config changed
      service:
        name: "{{ ssh_service_name }}"
        state: reloaded
      when: ssh_service_name is defined

    - name: Allow SSH from permitted subnets
      ufw:
        rule: allow
        port: "{{ network_config.ssh_port }}"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ network_allow_subnets }}"

    - name: Allow Proxmox web UI from permitted subnets
      ufw:
        rule: allow
        port: "8006"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ network_allow_subnets }}"

    - name: Allow RDP from permitted subnets (if enabled)
      ufw:
        rule: allow
        port: "{{ network_config.rdp_port }}"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ network_allow_subnets }}"
      when: network_config.allow_rdp | bool

    - name: Ensure UFW is enabled with logging (low)
      ufw:
        state: enabled
        logging: low
      notify: Reload ufw

  handlers:
    - name: Reload ufw
      ufw:
        state: reloaded
