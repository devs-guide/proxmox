---
- name: "[debian]: ansible venv (python 3.12 / ansible 13)"
  hosts: all
  become: true
  vars:
    ansible_venv: "{{ controller_ansible_venv | default('/opt/ansible-venv') }}"
    python_version: "{{ controller_python_version | default('3.12.3') }}"
    python_major_minor: "{{ controller_python_major_minor | default('3.12') }}"
    python_prefix: "{{ controller_python_prefix | default('/usr/local') }}"
    ansible_core_spec: "{{ controller_ansible_core_spec | default('ansible-core>=2.20,<2.21') }}"
    ansible_core_min: "{{ controller_ansible_core_min | default('2.20') }}"
    ansible_core_ceiling: "{{ controller_ansible_core_ceiling | default('2.21') }}"
    python_bootstrap_bin_default: "{{ managed_target_python_path | default(python_prefix ~ '/bin/python' ~ python_major_minor) }}"
  tasks:
    - name: Check current venv ansible version (if present)
      command: "{{ ansible_venv }}/bin/ansible-playbook --version"
      register: ansible_venv_ansible_version
      failed_when: false
      changed_when: false

    - name: Extract managed ansible core version safely
      set_fact:
        ansible_venv_core_version: >-
          {{
            (
              ansible_venv_ansible_version.stdout
              | default('')
              | regex_search('core ([0-9]+\\.[0-9]+(?:\\.[0-9]+)?)', '\\1')
              | default('', true)
            )
          }}

    - name: Determine if venv repair is required
      set_fact:
        ansible_venv_required: >-
          {{
            (ansible_venv_ansible_version.rc != 0)
            or (
              (ansible_venv_core_version | length) == 0
            )
            or (ansible_venv_core_version is version(ansible_core_min, '<'))
            or (ansible_venv_core_version is version(ansible_core_ceiling, '>='))
          }}

    - name: Skip venv setup when managed Ansible already meets policy
      meta: end_play
      when: not ansible_venv_required

    - name: Check current venv python version (if present)
      command: "{{ ansible_venv }}/bin/python -c 'import sys; print(f\"{sys.version_info[0]}.{sys.version_info[1]}.{sys.version_info[2]}\")'"
      register: ansible_venv_python_version
      failed_when: false
      changed_when: false

    - name: Select python for ansible venv
      set_fact:
        ansible_venv_python: "{{ python_bootstrap_bin | default(python_bootstrap_bin_default) }}"

    - name: Remove existing Ansible venv if outdated (python or ansible)
      file:
        path: "{{ ansible_venv }}"
        state: absent
      when:
        - ansible_venv_python_version.rc != 0
          or (ansible_venv_python_version.stdout is defined and not ansible_venv_python_version.stdout.startswith(python_major_minor))
          or (ansible_venv_core_version | length) == 0
          or (ansible_venv_core_version is version(ansible_core_min, '<'))
          or (ansible_venv_core_version is version(ansible_core_ceiling, '>='))

    - name: Create ansible venv directory
      file:
        path: "{{ ansible_venv }}"
        state: directory
        mode: "0755"

    - name: Create ansible venv if missing
      command: "{{ ansible_venv_python }} -m venv \"{{ ansible_venv }}\""
      args:
        creates: "{{ ansible_venv }}/bin/activate"

    - name: Upgrade pip tooling in venv
      command: "{{ ansible_venv }}/bin/pip install --upgrade pip setuptools wheel"
      environment:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"

    - name: Install Ansible core into venv
      command: "{{ ansible_venv }}/bin/pip install --upgrade {{ ansible_core_spec }}"
      environment:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"

    - name: Install required Ansible collections in venv
      command: "{{ ansible_venv }}/bin/ansible-galaxy collection install community.general:8.6.0"
      environment:
        ANSIBLE_FORCE_COLOR: "false"
      register: install_collections
      changed_when: "'Nothing to do' not in install_collections.stdout"

    - name: Ensure passlib available in venv
      command: "{{ ansible_venv }}/bin/pip install --upgrade passlib"
      environment:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"

    - name: Expose preferred ansible-playbook path
      set_fact:
        ansible_playbook_bin: "{{ ansible_venv }}/bin/ansible-playbook"
