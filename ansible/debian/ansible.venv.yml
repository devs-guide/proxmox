---
- name: "[debian]: ansible venv (python 3.11)"
  hosts: all
  become: true
  vars:
    python_version: "3.11.9"
    python_major_minor: "3.11"
    python_prefix: "/usr/local"
    python_src_dir: "{{ python_prefix }}/src/Python-{{ python_version }}"
    python_src_url: "https://www.python.org/ftp/python/{{ python_version }}/Python-{{ python_version }}.tgz"
    python_src_archive: "{{ python_src_dir }}.tgz"
    ansible_venv: "/opt/ansible-venv"
    ansible_core_spec: "{{ ansible_core_spec | default('ansible-core>=2.19,<2.21') }}"
    ansible_core_min: "{{ ansible_core_min | default('2.19') }}"
    ansible_venv_python: "{{ python_prefix }}/bin/python{{ python_major_minor }}"
    system_python_candidates:
      - python3.11
      - python3
    python_build_deps:
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - libncursesw5-dev
      - tk-dev
      - libgdbm-dev
      - libgdbm-compat-dev
      - liblzma-dev
      - libffi-dev
      - uuid-dev
      - wget
      - curl
      - ca-certificates
      - xz-utils
  tasks:
    - name: Check system ansible version
      command: ansible-playbook --version
      register: system_ansible_version
      failed_when: false
      changed_when: false

    - name: Determine if venv is required
      set_fact:
        ansible_venv_required: >-
          {{
            (system_ansible_version.rc != 0)
            or (
              (
                (system_ansible_version.stdout | default('') | regex_search('ansible \\[core ([0-9.]+)\\]', '\\1') | default(''))
              ) is version(ansible_core_min, '<')
            )
          }}

    - name: Skip venv setup when system ansible meets minimum
      meta: end_play
      when: not ansible_venv_required

    - name: Check current venv python version (if present)
      command: "{{ ansible_venv }}/bin/python -c 'import sys; print(f\"{sys.version_info[0]}.{sys.version_info[1]}.{sys.version_info[2]}\")'"
      register: ansible_venv_python_version
      failed_when: false
      changed_when: false

    - name: Check current venv ansible version (if present)
      command: "{{ ansible_venv }}/bin/ansible-playbook --version"
      register: ansible_venv_ansible_version
      failed_when: false
      changed_when: false

    - name: Ensure python build deps present
      apt:
        name: "{{ python_build_deps }}"
        state: present
        update_cache: true

    - name: Try to locate a system python3.11
      shell: |
        set -e
        for cand in {{ system_python_candidates | join(' ') }}; do
          if command -v "$cand" >/dev/null 2>&1; then
            echo "$cand"
            exit 0
          fi
        done
        exit 1
      register: system_python
      changed_when: false
      failed_when: false

    - name: Ensure python source directory exists
      file:
        path: "{{ python_prefix }}/src"
        state: directory
        mode: "0755"

    - name: Download Python {{ python_version }} source
      get_url:
        url: "{{ python_src_url }}"
        dest: "{{ python_src_archive }}"
        mode: "0644"
      when: system_python.rc != 0

    - name: Unpack Python {{ python_version }} source
      unarchive:
        src: "{{ python_src_archive }}"
        dest: "{{ python_prefix }}/src"
        remote_src: true
        creates: "{{ python_src_dir }}"
      when: system_python.rc != 0

    - name: Build and install Python {{ python_version }}
      shell: |
        ./configure --enable-optimizations --with-ensurepip=install
        make -j"$(nproc)"
        make altinstall
      args:
        chdir: "{{ python_src_dir }}"
        creates: "{{ ansible_venv_python }}"
      when: system_python.rc != 0

    - name: Select python for venv (prefer system if available)
      set_fact:
        ansible_venv_python: >-
          {{
            (system_python.stdout | default('') | trim)
            if system_python.rc == 0 else ansible_venv_python
          }}

    - name: Remove existing Ansible venv if outdated (python or ansible)
      file:
        path: "{{ ansible_venv }}"
        state: absent
      when:
        - ansible_venv_python_version.rc != 0
          or (ansible_venv_python_version.stdout is defined and not ansible_venv_python_version.stdout.startswith(python_major_minor))
          or (ansible_venv_ansible_version.stdout is defined and (ansible_venv_ansible_version.stdout | regex_search('([0-9]+\\.[0-9]+\\.[0-9]+)')) is version(ansible_core_min, '<'))

    - name: Create ansible venv directory
      file:
        path: "{{ ansible_venv }}"
        state: directory
        mode: "0755"

    - name: Create ansible venv if missing
      command: "{{ ansible_venv_python }} -m venv \"{{ ansible_venv }}\""
      args:
        creates: "{{ ansible_venv }}/bin/activate"

    - name: Upgrade pip tooling in venv
      command: "{{ ansible_venv }}/bin/pip install --upgrade pip setuptools wheel"
      environment:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"

    - name: Install Ansible core into venv
      command: "{{ ansible_venv }}/bin/pip install --upgrade {{ ansible_core_spec }}"
      environment:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"

    - name: Install required Ansible collections in venv
      command: "{{ ansible_venv }}/bin/ansible-galaxy collection install community.general:8.6.0"
      environment:
        ANSIBLE_FORCE_COLOR: "false"
      register: install_collections
      changed_when: "'Nothing to do' not in install_collections.stdout"

    - name: Ensure passlib available in venv
      command: "{{ ansible_venv }}/bin/pip install --upgrade passlib"
      environment:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"

    - name: Expose preferred ansible-playbook path
      set_fact:
        ansible_playbook_bin: "{{ ansible_venv }}/bin/ansible-playbook"
