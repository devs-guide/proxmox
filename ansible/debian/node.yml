---
- name: "[debian]: node via nvm"
  hosts: all
  connection: local
  gather_facts: false
  become: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed }}"
    node_enable: false
    nvm_version: "v0.39.7"
    nvm_dir: "/root/.nvm"
    node_version: "lts/*"

  tasks:
    - name: Check if nvm is already installed
      stat:
        path: "{{ nvm_dir }}/nvm.sh"
      register: nvm_sh

    - name: Download nvm installer (if missing)
      get_url:
        url: "https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh"
        dest: /tmp/nvm-install.sh
        mode: "0755"
      when: not nvm_sh.stat.exists

    - name: Install nvm (if missing)
      shell: |
        set -e
        export NVM_DIR="{{ nvm_dir }}"
        /bin/bash /tmp/nvm-install.sh
      args:
        creates: "{{ nvm_dir }}/nvm.sh"
      when:
        - node_enable | bool
        - not nvm_sh.stat.exists

    - name: Install Node.js via nvm
      shell: |
        set -e
        export NVM_DIR="{{ nvm_dir }}"
        . "{{ nvm_dir }}/nvm.sh"
        if ! nvm ls "{{ node_version }}" >/dev/null 2>&1; then
          nvm install "{{ node_version }}"
          changed=1
        else
          changed=0
        fi
        nvm alias default "{{ node_version }}"
        echo "changed=${changed}"
      register: node_install_result
      changed_when: "'changed=1' in node_install_result.stdout"
      when: node_enable | bool

    - name: Ensure nvm profile hook is available
      copy:
        dest: /etc/profile.d/nvm.sh
        mode: "0644"
        content: |
          export NVM_DIR="{{ nvm_dir }}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"
      when: node_enable | bool

    - name: Ensure root bashrc sources nvm
      lineinfile:
        path: /root/.bashrc
        create: yes
        line: '[ -s /etc/profile.d/nvm.sh ] && . /etc/profile.d/nvm.sh'
        state: present
      when: node_enable | bool

    - name: Symlink node and npm for non-login shells
      shell: |
        set -e
        export NVM_DIR="{{ nvm_dir }}"
        . "{{ nvm_dir }}/nvm.sh"
        node_path="$(nvm which default)"
        npm_path="$(dirname "$node_path")/npm"
        changed=0
        if [ -x "$node_path" ]; then
          if [ "$(readlink /usr/local/bin/node 2>/dev/null || true)" != "$node_path" ]; then
            changed=1
          fi
          ln -sf "$node_path" /usr/local/bin/node
        fi
        if [ -x "$npm_path" ]; then
          if [ "$(readlink /usr/local/bin/npm 2>/dev/null || true)" != "$npm_path" ]; then
            changed=1
          fi
          ln -sf "$npm_path" /usr/local/bin/npm
        fi
        echo "changed=${changed}"
      register: node_symlink_result
      changed_when: "'changed=1' in node_symlink_result.stdout"
      when:
        - node_enable | bool
        - nvm_sh.stat.exists
