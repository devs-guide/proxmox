---
# Canonical Debian package groups for Proxmox host prep and hardening.
# Can be consumed by ansible-core via `lookup('file', 'ansible/debian.install.pkg.list') | from_yaml`.
groups:
  base:
    description: Essential base tooling and SSH.
    packages:
      - sudo
      - ca-certificates
      - gnupg
      - curl
      - lsb-release
      - net-tools
      - iproute2
      - openssh-server
  time_sync:
    description: Reliable time sync (prefer chrony over timesyncd on servers).
    packages:
      - chrony
  security:
    description: Host-level hardening/fencing.
    packages:
      - ufw
      - apparmor
      - apparmor-profiles
      - apparmor-profiles-extra
      - unattended-upgrades
      - apt-listchanges
      - needrestart
      - fail2ban
      - auditd
      - audispd-plugins
      - libpam-tmpdir
      - libpam-passwdqc
  storage:
    description: Disk management, RAID, filesystems.
    packages:
      - nvme-cli
      - hdparm
      - util-linux
      - mdadm
      - lvm2
      - lsscsi
      - smartmontools
      - xattr
  monitoring_benchmark:
    description: System monitoring and I/O benchmarks.
    packages:
      - htop
      - sysstat
      - atop
      - nmon
      - dstat
      - iotop
      - bmon
      - lm-sensors
      - fancontrol
      - i2c-tools
      - hddtemp
      - radeontop
      - fio
      - bonnie++
  networking:
    description: Network tests and small utilities.
    packages:
      - iperf3
      - tree
      - mailutils
      - nftables
      - iptables-persistent
  hardware_info:
    description: Hardware inventory and firmware data.
    packages:
      - lshw
      - dmidecode
      - inxi
      - mesa-utils
      - pciutils
      - usbutils
      - hwinfo
      - intel-gpu-tools
      - nvidia-detect    # optional, requires contrib/non-free enabled
      - firmware-amd-graphics  # optional AMD GPU firmware (non-free)
      - ipmitool
      - freeipmi-tools
      - ipmiutil
      - smartmontools
      - nvme-cli
      - hdparm
      - openssh-client
  dev_tools:
    description: Developer/admin utilities.
    packages:
      - git
      - python3
      - ksh
  desktop_rdp_optional:
    description: Optional lightweight GUI and RDP stack.
    packages:
      - xrdp
      - xfce4
      - xfce4-goodies
      - xorg
      - dbus-x11
      - x11-xserver-utils
      - task-lxde-desktop
  performance_power:
    description: CPU power management.
    packages:
      - linux-cpupower
  firmware:
    description: Firmware commonly needed on commodity NICs.
    packages:
      - firmware-realtek
