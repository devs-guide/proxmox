---
- name: Install Debian packages (grouped, user-tunable)
  hosts: all
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed }}"
    # Path to canonical package catalog (local) and remote fallback
    package_catalog_file: "{{ playbook_dir }}/{{ package_catalog_filename | default('debian.packages.yml') }}"
    package_catalog_url_effective: "{{ package_catalog_url | default(pages_base_url ~ '/' ~ pages_ansible_dir ~ '/' ~ package_catalog_filename) }}"

    # Enable/disable specific groups; defaults come from default_disabled_groups
    package_group_overrides: {}  # e.g., { security: false, desktop_rdp_optional: true }
    # Release-specific package overrides; each key maps to a group name.
    package_overrides: {}
    # Host platform flavor (proxmox or debian); default proxmox for safety
    host_platform_family: "proxmox"
    # Packages always excluded on Proxmox hosts to avoid pve-firmware conflicts
    proxmox_excludes:
      - firmware-amd-graphics
      - firmware-realtek

    # Groups that are disabled by default but can be opted into via overrides
    # Keep desktop off by default everywhere; other optional groups are gated per host flavor.
    default_disabled_groups_base:
      - desktop_rdp_optional
    # Computed effective defaults (adds Proxmox-only disables)
    effective_disabled_groups: []

    # Optional: drop specific packages globally without editing the catalog
    exclude_packages: []   # e.g., [ "mailutils", "task-lxde-desktop" ]

  pre_tasks:
    - name: Add proxmox-specific excludes to global exclude list
      ansible.builtin.set_fact:
        exclude_packages: "{{ exclude_packages + proxmox_excludes }}"
      when: host_platform_family == 'proxmox'

    - name: Ensure package catalog exists alongside playbook
      ansible.builtin.stat:
        path: "{{ package_catalog_file }}"
      register: pkg_catalog

    - name: Download package catalog if missing
      ansible.builtin.get_url:
        url: "{{ package_catalog_url_effective }}"
        dest: "{{ package_catalog_file }}"
        mode: "0644"
      when: not pkg_catalog.stat.exists

    - name: Load canonical Debian package catalog
      ansible.builtin.set_fact:
        package_catalog: "{{ lookup('file', package_catalog_file) | from_yaml }}"

    - name: Merge package overrides into catalog
      ansible.builtin.set_fact:
        effective_catalog: "{{ package_catalog.groups | combine(package_overrides, recursive=True) }}"

    - name: Apply host flavor gating
      ansible.builtin.set_fact:
        effective_catalog: >-
          {{
            effective_catalog
            | dict2items
            | rejectattr('key', 'in', (host_platform_family == 'proxmox') | ternary(['firmware', 'apple_media_optional'], []))
            | list
            | items2dict
          }}

    - name: Compute effective default-disabled groups
      ansible.builtin.set_fact:
        effective_disabled_groups: >-
          {{
            default_disabled_groups_base
            + ((host_platform_family == 'proxmox') | ternary(['apple_media_optional', 'firmware'], []))
            + ((host_platform_family == 'proxmox') | ternary(['gpu_vendor_optional'], []))
          }}

    - name: Show effective package groups (post-excludes)
      debug:
        msg: "Group {{ item.key }} packages: {{ item.value.packages | default([]) }}"
      loop: "{{ effective_catalog | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Simulate package installs per group (detect proxmox meta removals)
      ansible.builtin.command: >
        apt-get -s install {{ (item.value.packages | default([]) | difference(exclude_packages)) | join(' ') }}
      register: sim_result
      changed_when: false
      failed_when: >
        ('proxmox-ve' in sim_result.stdout)
        or ('proxmox-default-kernel' in sim_result.stdout)
        or ('pve-firmware' in sim_result.stdout)
        or sim_result.rc != 0
      loop: "{{ effective_catalog | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.value.packages | default([]) | difference(exclude_packages) | length > 0
        - package_group_overrides.get(item.key, item.key not in effective_disabled_groups)

    - name: Refresh apt cache (honors apt_cache_valid_time/apt_skip_cache_refresh)
      ansible.builtin.command:
        argv:
          - apt-get
          - update
      when: not apt_skip_cache_refresh | default(false)
      changed_when: false

  tasks:
    - name: Install package groups (honor enabled/override flags and exclude list)
      ansible.builtin.command:
        argv: "{{ ['apt-get', '-y', 'install'] + (item.value.packages | default([]) | difference(exclude_packages)) }}"
      loop: "{{ effective_catalog | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.value.packages | default([]) | difference(exclude_packages) | length > 0
        - package_group_overrides.get(item.key, item.key not in effective_disabled_groups)
