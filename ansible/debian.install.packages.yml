---
- name: Install Debian packages (grouped, user-tunable)
  hosts: all
  become: true
  vars:
    # Path to canonical package catalog (local) and remote fallback
    package_catalog_file: "{{ playbook_dir }}/{{ package_catalog_filename | default('debian.packages.yml') }}"
    package_catalog_url_effective: "{{ package_catalog_url | default(pages_base_url ~ '/' ~ pages_ansible_dir ~ '/' ~ package_catalog_filename) }}"

    # Enable/disable specific groups; defaults come from default_disabled_groups
    package_group_overrides: {}  # e.g., { security: false, desktop_rdp_optional: true }

    # Groups that are disabled by default but can be opted into via overrides
    default_disabled_groups:
      - desktop_rdp_optional

    # Optional: drop specific packages globally without editing the catalog
    exclude_packages: []   # e.g., [ "mailutils", "task-lxde-desktop" ]

    # Cache refresh policy: defaults come from group_vars/all.yml
    apt_cache_valid_time: "{{ apt_cache_valid_time | default(86400) }}"
    apt_skip_cache_refresh: "{{ apt_skip_cache_refresh | default(false) }}"

  pre_tasks:
    - name: Ensure package catalog exists alongside playbook
      ansible.builtin.stat:
        path: "{{ package_catalog_file }}"
      register: pkg_catalog

    - name: Download package catalog if missing
      ansible.builtin.get_url:
        url: "{{ package_catalog_url_effective }}"
        dest: "{{ package_catalog_file }}"
        mode: "0644"
      when: not pkg_catalog.stat.exists

    - name: Load canonical Debian package catalog
      ansible.builtin.set_fact:
        package_catalog: "{{ lookup('file', package_catalog_file) | from_yaml }}"

    - name: Refresh apt cache (honors apt_cache_valid_time/apt_skip_cache_refresh)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time }}"
      when: not apt_skip_cache_refresh | bool

  tasks:
    - name: Install package groups (honor enabled/override flags and exclude list)
      ansible.builtin.apt:
        name: "{{ item.value.packages | difference(exclude_packages) }}"
        state: present
      loop: "{{ package_catalog.groups | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.value.packages | default([]) | difference(exclude_packages) | length > 0
        - package_group_overrides.get(item.key, item.key not in default_disabled_groups)
