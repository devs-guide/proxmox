---
- name: Disable suspend/hibernate and idle actions on Debian
  hosts: debian_hosts
  become: true
  vars:
    sleep_conf_path: /etc/systemd/sleep.conf
    logind_conf_path: /etc/systemd/logind.conf
    cpupower_default_path: /etc/default/cpupower
    sleep_settings:
      - { option: AllowSuspend, value: "no" }
      - { option: AllowHibernation, value: "no" }
      - { option: AllowHybridSleep, value: "no" }
      - { option: AllowSuspendThenHibernate, value: "no" }
    logind_settings:
      - { option: IdleAction, value: ignore }
      - { option: HandlePowerKey, value: poweroff }
      - { option: HandleLidSwitch, value: ignore }
      - { option: HandleLidSwitchDocked, value: ignore }
    mask_targets:
      - sleep.target
      - suspend.target
      - hibernate.target
      - hybrid-sleep.target
    cpupower_enable: true                  # set false to skip governor change
    usb_autosuspend_disable: true          # set false to keep autosuspend default
    disable_console_blanking: false        # set true if you want local TTY to stay awake

  pre_tasks:
    - name: Assert Debian family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: "This playbook is intended for Debian-family hosts."

  tasks:
    - name: Collect installed package facts (apt)
      ansible.builtin.package_facts:
        manager: apt

    - name: Configure system sleep policies
      ansible.builtin.ini_file:
        path: "{{ sleep_conf_path }}"
        section: Sleep
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        owner: root
        group: root
        mode: "0644"
        no_extra_spaces: true
      loop: "{{ sleep_settings }}"
      notify: Reload systemd daemon

    - name: Configure logind idle action
      ansible.builtin.ini_file:
        path: "{{ logind_conf_path }}"
        section: Login
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        owner: root
        group: root
        mode: "0644"
        no_extra_spaces: true
      loop: "{{ logind_settings }}"
      notify:
        - Reload systemd daemon
        - Restart systemd-logind

    - name: Mask sleep and hibernate targets
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: true
        state: stopped
        daemon_reload: true
      loop: "{{ mask_targets }}"

    - name: Set CPU governor to performance (if cpupower installed)
      ansible.builtin.copy:
        dest: "{{ cpupower_default_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible: set governor to performance for low-latency hosts
          GOVERNOR="performance"
      when:
        - cpupower_enable
        - "'linux-cpupower' in ansible_facts.packages"
      notify: Restart cpupower service

    - name: Ensure cpupower service enabled (if present)
      ansible.builtin.systemd:
        name: cpupower.service
        enabled: true
        state: started
      when:
        - cpupower_enable
        - "'linux-cpupower' in ansible_facts.packages"

    - name: Disable USB autosuspend (modprobe)
      ansible.builtin.copy:
        dest: /etc/modprobe.d/99-usb-autosuspend.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible: keep USB devices powered (UPS disks, USB NICs)
          options usbcore autosuspend=-1
      when: usb_autosuspend_disable

    - name: Disable console blanking on tty1 (optional)
      ansible.builtin.file:
        path: /etc/systemd/system/getty@tty1.service.d
        state: directory
        mode: "0755"
      when: disable_console_blanking

    - name: Apply console no-blank drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/getty@tty1.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty -o '-p -- \\u' --noclear --keep-baud tty1 115200,38400,9600 linux
          ExecStartPost=/bin/sh -c '/usr/bin/setterm -blank 0 -powerdown 0 >/dev/tty1'
      when: disable_console_blanking
      notify: Reload systemd daemon

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.command: systemctl daemon-reload
      become: true

    - name: Restart systemd-logind
      ansible.builtin.service:
        name: systemd-logind
        state: restarted

    - name: Restart cpupower service
      ansible.builtin.service:
        name: cpupower
        state: restarted
