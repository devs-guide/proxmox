---
- name: "[pve-6.4]: base packages"
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  vars:
    base_packages:
      - ca-certificates
      - curl
      - wget
      - vim-tiny
      - htop
      - tmux
      - net-tools
      - rsync

  tasks:
    - name: Install baseline tools (allow unauth for archive repos)
      apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: false
        allow_unauthenticated: true
