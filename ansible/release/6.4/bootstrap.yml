---
- name: "[pve-6.4]: apt bootstrap"
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  vars:
    ansible_python_interpreter: "{{ bootstrap_bridge_python_interpreter | default(ansible_python_interpreter_system) }}"
    apt_cache_valid_time: 0

  tasks:
    - name: Update apt cache (archive, allow unauth)
      command:
        argv:
          - apt-get
          - update
      changed_when: false

    - name: Safe upgrade
      command:
        argv:
          - apt-get
          - "-y"
          - "--allow-unauthenticated"
          - upgrade
