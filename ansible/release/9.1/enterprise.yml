---
- name: "[pve-9.x]: proxmox repo policy"
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_managed }}"
    pve_release: "{{ proxmox_suite | default('trixie') }}"
    proxmox_enterprise: false   # override via -e proxmox_enterprise=true
    proxmox_sources_path: "/etc/apt/sources.list.d/proxmox.sources"
    proxmox_key_path: "/etc/apt/keyrings/proxmox-release-trixie.gpg"
    proxmox_key_url: "https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg"
    proxmox_enterprise_cleanup_regex: "(enterprise\\.proxmox\\.com/debian/(pve|ceph)|pve-enterprise|ceph-squid)"

  tasks:
    - name: Ensure apt keyring directory exists
      file:
        path: "/etc/apt/keyrings"
        state: directory
        mode: "0755"

    - name: Check for existing Proxmox repository key
      stat:
        path: "{{ proxmox_key_path }}"
      register: proxmox_key

    - name: Install Proxmox repository key (if missing)
      get_url:
        url: "{{ proxmox_key_url }}"
        dest: "{{ proxmox_key_path }}"
        mode: "0644"
      when: not proxmox_key.stat.exists

    - name: Determine Proxmox component
      set_fact:
        proxmox_component: "{{ 'pve-enterprise' if proxmox_enterprise | bool else 'pve-no-subscription' }}"

    - name: Configure Proxmox repo (deb822)
      copy:
        dest: "{{ proxmox_sources_path }}"
        mode: "0644"
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ pve_release }}
          Components: {{ proxmox_component }}
          Signed-By: {{ proxmox_key_path }}

    - name: Remove legacy list files if present
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/pve-no-subscription.list
        - /etc/apt/sources.list.d/ceph.list
        - /etc/apt/trusted.gpg.d/ceph.release.gpg

    - name: Find enterprise deb822/list apt source files for cleanup
      shell: >-
        grep -lER
        --include='*.list'
        --include='*.sources'
        '{{ proxmox_enterprise_cleanup_regex }}'
        /etc/apt/sources.list.d
      register: proxmox_enterprise_source_cleanup
      changed_when: false
      failed_when: false
      when: not proxmox_enterprise | bool

    - name: Remove enterprise deb822/list apt source files when using no-subscription
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ proxmox_enterprise_source_cleanup.stdout_lines | default([], true) }}"
      when:
        - not proxmox_enterprise | bool
        - (proxmox_enterprise_source_cleanup.stdout_lines | default([], true) | length) > 0
