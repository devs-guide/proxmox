---
- name: "[pve-9.x]: apt bootstrap"
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  vars:
    ansible_python_interpreter: "{{ ansible_python_interpreter_system }}"
    apt_cache_valid_time: 0

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time }}"

    - name: Safe upgrade
      apt:
        upgrade: safe
