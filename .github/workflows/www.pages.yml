# .github/workflows/www.pages.yml

name: Publish static assets to www (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'bootstrap/**'
      - 'ansible/**'
      - 'setup/**'
      - 'setup/vm/**'
      - 'cli/**'
      - 'docs/**'
      - 'www/**'
      - 'actions/validate.pages.sh'
      - 'actions/validate.vm.restore.sh'
      - 'actions/www.pages.sh'
      - '.github/workflows/www.pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # required to push to www

concurrency:
  group: www-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-www:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # preserve full history, as in the original workflow
          fetch-depth: 0
          
      - name: Install restore validation dependencies
        run: sudo apt-get update ; sudo apt-get install -y rsync jq

      - name: Validate remote VM restore CLI contracts
        run: ./actions/validate.vm.restore.sh

      - name: Build static/ tree for GitHub Pages
        env:
          PUBLISH_DIR: static       # optional; defaults to "static" anyway
        run: ./actions/www.pages.sh

      - name: Validate local Pages artifacts before deploy
        env:
          VALIDATE_PAGES_MODE: local
          STATIC_DIR: ./static
        run: ./actions/validate.pages.sh

      - name: Validate staged wrapper dependency graph before deploy
        env:
          VALIDATE_PAGES_MODE: local
          STATIC_DIR: ./static
          VALIDATE_PAGES_GRAPH_ONLY: 1
        run: ./actions/validate.pages.sh

      - name: Deploy static/ to www branch (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static
          publish_branch: www
          force_orphan: true
