# .github/workflows/www.pages.yml

name: Publish static assets to www (GitHub Pages)

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'bootstrap/**'
      - 'ansible/**'
      - 'setup/**'
      - 'setup/vm/**'
      - 'cli/**'
      - 'docs/**'
      - 'www/**'
      - 'actions/validate*.sh'
      - 'actions/pages.features.txt'
      - 'actions/www.pages.sh'
      - '.github/workflows/www.pages.yml'
      - '.github/workflows/www.pages.remote.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bootstrap/**'
      - 'ansible/**'
      - 'setup/**'
      - 'setup/vm/**'
      - 'cli/**'
      - 'docs/**'
      - 'www/**'
      - 'actions/validate*.sh'
      - 'actions/pages.features.txt'
      - 'actions/www.pages.sh'
      - '.github/workflows/www.pages.yml'
      - '.github/workflows/www.pages.remote.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch to publish: main or feature/**'
        required: true
        type: string
      source_sha:
        description: 'Exact 40-character commit SHA at the tip of source_ref'
        required: true
        type: string
      confirm_live_publish:
        description: 'Type: publish-www <source_ref>@<source_sha>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: www-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible-collections
    outputs:
      candidate_ref: ${{ steps.candidate.outputs.ref }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Resolve and authorize exact candidate
        id: candidate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
          PR_REF: ${{ github.head_ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          LIVE_CONFIRMATION: ${{ inputs.confirm_live_publish }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            workflow_dispatch)
              git check-ref-format --branch "${SOURCE_REF}" >/dev/null
              case "${SOURCE_REF}" in
                main|feature/*) ;;
                *)
                  echo "[www.pages][error] source_ref must be main or feature/**" >&2
                  exit 1
                  ;;
              esac
              [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
                echo "[www.pages][error] source_sha must be a lowercase full commit SHA" >&2
                exit 1
              }
              expected_confirmation="publish-www ${SOURCE_REF}@${SOURCE_SHA}"
              [[ "${LIVE_CONFIRMATION}" == "${expected_confirmation}" ]] || {
                echo "[www.pages][error] live publication confirmation did not match" >&2
                echo "[www.pages][error] expected: ${expected_confirmation}" >&2
                exit 1
              }
              remote_sha="$(
                git ls-remote --exit-code --heads origin "refs/heads/${SOURCE_REF}" \
                  | awk 'NR == 1 { print $1 }'
              )"
              [[ "${remote_sha}" == "${SOURCE_SHA}" ]] || {
                echo "[www.pages][error] ${SOURCE_REF} resolves to ${remote_sha:-<missing>}, not ${SOURCE_SHA}" >&2
                exit 1
              }
              candidate_ref="${SOURCE_REF}"
              expected_sha="${SOURCE_SHA}"
              ;;
            pull_request)
              candidate_ref="${PR_REF}"
              expected_sha="${PR_SHA}"
              ;;
            push)
              candidate_ref="${PUSH_REF}"
              expected_sha="${PUSH_SHA}"
              ;;
            *)
              echo "[www.pages][error] unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          candidate_sha="$(git rev-parse HEAD)"
          [[ "${candidate_sha}" == "${expected_sha}" ]] || {
            echo "[www.pages][error] checked out ${candidate_sha}, expected ${expected_sha}" >&2
            exit 1
          }

          echo "[www.pages] candidate: ${candidate_ref}@${candidate_sha}"
          {
            echo "ref=${candidate_ref}"
            echo "sha=${candidate_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Configure Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          check-latest: false

      - name: Install pinned validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssh-client rsync udev ufw util-linux
          python -m pip install --disable-pip-version-check \
            'ansible-core==2.20.5' \
            'PyYAML==6.0.2' \
            'passlib==1.7.4'
          ansible-galaxy collection install \
            -p "${ANSIBLE_COLLECTIONS_PATH}" \
            'community.general:==13.2.0'

      - name: Verify pinned validation environment
        run: |
          python - <<'PY'
          import importlib.metadata
          import sys

          expected = {
              "ansible-core": "2.20.5",
              "PyYAML": "6.0.2",
              "passlib": "1.7.4",
          }
          if sys.version_info[:2] != (3, 13):
              raise SystemExit(f"expected Python 3.13, found {sys.version}")
          for package, version in expected.items():
              observed = importlib.metadata.version(package)
              if observed != version:
                  raise SystemExit(
                      f"expected {package}=={version}, found {observed}"
                  )
          PY
          observed_collection="$(
            ansible-galaxy collection list community.general \
              | awk '$1 == "community.general" {print $2; exit}'
          )"
          test "${observed_collection}" = '13.2.0'

      - name: Validate release, runtime, and feature contracts
        run: |
          run_contract_validator() {
            local validator="$1"
            local output=""
            local status=0
            local summary=""

            set +e
            output="$("${validator}" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "${output}"

            if [[ "${status}" -ne 0 ]]; then
              summary="$(printf '%s\n' "${output}" | awk 'NF { line=$0 } END { print line }')"
              [[ -n "${summary}" ]] || summary="exited with status ${status}"
              summary="${summary//'%'/'%25'}"
              summary="${summary//$'\r'/'%0D'}"
              summary="${summary//$'\n'/'%0A'}"
              printf '::error file=%s,title=Validation contract failed::%s\n' \
                "${validator#./}" "${summary}"
              return "${status}"
            fi
          }

          run_contract_validator ./actions/validate.release.sh
          run_contract_validator ./actions/validate.runtime.sh

          for validator in ./actions/validate.*.sh; do
            case "$(basename "${validator}")" in
              validate.pages.sh|validate.release.sh|validate.runtime.sh|validate.vm.restore.sh)
                continue
                ;;
            esac
            echo "[www.pages] running dedicated validator: ${validator}"
            run_contract_validator "${validator}"
          done

      - name: Build static Pages tree
        env:
          PUBLISH_DIR: static
        run: ./actions/www.pages.sh

      - name: Validate local Pages tree and dependency graph
        env:
          VALIDATE_PAGES_MODE: local
          STATIC_DIR: ./static
        run: ./actions/validate.pages.sh

      - name: Upload immutable Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ steps.candidate.outputs.sha }}
          path: ./static
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy-www:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment:
      name: github-pages
      url: https://devs-guide.github.io/proxmox/
    concurrency:
      group: www-pages-live
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact validated Pages artifact
        uses: actions/download-artifact@v5
        with:
          name: pages-${{ needs.validate.outputs.candidate_sha }}
          path: ./static

      - name: Deploy validated artifact to www branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static
          publish_branch: www
          force_orphan: true
          full_commit_message: "deploy: ${{ needs.validate.outputs.candidate_ref }}@${{ needs.validate.outputs.candidate_sha }} via actions/${{ github.run_id }}"

  validate-published-pages:
    if: needs.deploy-www.result == 'success'
    needs: [ validate, deploy-www ]
    uses: ./.github/workflows/www.pages.remote.yml
    with:
      source_sha: ${{ needs.validate.outputs.candidate_sha }}
    permissions:
      contents: read
