name: Publish static assets to www (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'bootstrap/**'
      - 'ansible/**'
      - 'docs/**'
      - '.github/workflows/pages-www.yml'

permissions:
  contents: write   # required to push to www

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build static/ tree for GitHub Pages
        run: |
          set -euo pipefail

          # Fresh static/ tree (CI workspace only; nothing is committed back to main)
          rm -rf static
          mkdir -p static

          #
          # 1) Main bootstrap script at site root:
          #    https://devs-guide.github.io/proxmox/metal.sh
          #
          cp bootstrap/metal.sh static/metal.sh
          chmod +x static/metal.sh || true

          #
          # 2) Optional: group additional shell helpers under /shell/
          #    e.g. https://devs-guide.github.io/proxmox/shell/install-ansible.sh
          #
          # mkdir -p static/shell
          # cp bootstrap/install-ansible.sh static/shell/install-ansible.sh

          #
          # 3) Publish a whitelist of Ansible content under /ansible/
          #    e.g. ansible/playbook-file.yml -> /ansible/playbook-file.yml
          #
          mkdir -p static/ansible
          rsync -av \
            --include='playbook-file.yml' \
            --include='another-playbook.yml' \
            --exclude='*' \
            ansible/ static/ansible/

          #
          # 4) Minimal index page (optional, for humans)
          #
          cat > static/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>devs-guide/proxmox bootstrap</title>
            </head>
            <body>
              <h1>devs-guide/proxmox bootstrap</h1>
              <p>Entry script: <code>metal.sh</code></p>
              <p>Usage:</p>
              <pre>curl -fsSL https://devs-guide.github.io/proxmox/metal.sh | bash</pre>
            </body>
          </html>
          EOF

          # Optional: add .nojekyll if you ever need to fully bypass Jekyll behavior.
          # It is not required just to serve .sh or .yml as static files.
          # touch static/.nojekyll

      - name: Deploy static/ to www branch (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static
          publish_branch: www       # Pages will read from branch=www, folder=/.
          force_orphan: true        # Keep www history clean and separate from main
