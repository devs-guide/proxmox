# .github/workflows/www.pages.remote.yml

name: Validate published Pages artifacts

on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Exact source commit represented by the live Pages tree'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact source commit expected on the live Pages site'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-published-pages:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Validate published Pages artifacts with retry
        env:
          VALIDATE_PAGES_MODE: remote
        run: |
          attempts=12
          delay_seconds=15
          attempt=1

          while (( attempt <= attempts )); do
            echo "[validate.pages.remote] attempt ${attempt}/${attempts}"
            if ./actions/validate.pages.sh; then
              exit 0
            fi

            if (( attempt == attempts )); then
              echo "[validate.pages.remote][error] published Pages artifacts never converged after deploy"
              exit 1
            fi

            sleep "${delay_seconds}"
            attempt=$((attempt + 1))
          done
